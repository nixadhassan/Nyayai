<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYAY AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <div id="auth-section" class="hidden min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm border">
            <h1 class="text-2xl font-black text-blue-950 mb-6 text-center">NYAY AI Access</h1>
            <input type="email" id="email" placeholder="Email" class="w-full p-3 mb-3 border rounded-lg">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 mb-6 border rounded-lg">
            <button onclick="handleAuth('login')" class="w-full bg-blue-900 text-white font-bold py-3 rounded-lg mb-3">Sign In</button>
            <button onclick="handleAuth('register')" class="w-full text-blue-900 font-bold py-3 text-sm">Create Account</button>
        </div>
    </div>

    <div id="app-section" class="hidden">
        <header class="bg-blue-950 text-white py-5 px-6 flex justify-between items-center">
            <h1 class="text-2xl font-black">NYAY AI</h1>
            <button onclick="logout()" class="text-xs bg-rose-700 px-3 py-1 rounded">Logout</button>
        </header>
        <div class="max-w-3xl mx-auto mt-10 px-4">
            <div class="bg-white p-6 rounded-xl shadow-sm border">
                <input type="file" id="file-upload" class="hidden" onchange="document.getElementById('btn-analyze').disabled=false" />
                <div onclick="document.getElementById('file-upload').click()" class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center cursor-pointer">
                    <p class="text-sm text-blue-600 font-bold">📁 Click to Select PDF</p>
                </div>
                <button id="btn-analyze" disabled onclick="handleUpload()" class="mt-4 w-full bg-blue-900 text-white font-bold py-3 rounded-lg disabled:opacity-50">Analyze</button>
            </div>
            <div id="results" class="mt-6 p-6 bg-white rounded-xl shadow-sm border hidden"></div>
        </div>
    </div>

    <script>
        const supabase = supabase.createClient('https://txxfkuhqcvpwuanomqdt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4eGZrdWhxY3Zwd3Vhbm9tcWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4ODQ0ODcsImV4cCI6MjA5NTQ2MDQ4N30.FlH_YoayYT6TFtBUBwTE9t4Ub0lBSgW0W-Ccoo_JWAU');

        // Logic to toggle views
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                document.getElementById('app-section').classList.remove('hidden');
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
            }
        }
        checkSession();

        async function handleAuth(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = (type === 'login') 
                ? await supabase.auth.signInWithPassword({ email, password })
                : await supabase.auth.signUp({ email, password });
            
            if (error) alert(error.message);
            else location.reload();
        }

        async function logout() {
            await supabase.auth.signOut();
            location.reload();
        }

        async function handleUpload() {
            const { data: { session } } = await supabase.auth.getSession();
            const formData = new FormData();
            formData.append('files', document.getElementById('file-upload').files[0]);
            
            const res = await fetch('https://nyayai-5pa1.onrender.com/api/analyze', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${session.access_token}` },
                body: formData
            });
            const data = await res.json();
            const resDiv = document.getElementById('results');
            resDiv.innerHTML = marked.parse(data.analysis);
            resDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
